name: Build custom Management Center (no APIKEY.FUN)
on:
  push:
    branches:
      - custom-no-apikey-fun
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'index.html'
      - 'logo.jpg'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/custom-management-panel.yml'
  workflow_dispatch:
concurrency:
  group: custom-management-panel-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test and build panel
        run: bun run verify
      - name: Publish independent release without deleting the stable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv dist/index.html dist/management.html
          test -s dist/management.html
          TAG="v8-custom-no-apikey-fun"
          DIGEST="$(sha256sum dist/management.html | cut -d' ' -f1)"
          NOTES="Custom Management Center build (APIKEY.FUN navigation hidden). Source commit: ${GITHUB_SHA}. management.html SHA256: ${DIGEST}. Backend API and OAuth behavior are unchanged by this UI artifact."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/management.html --clobber
            gh release edit "$TAG" --title "Custom Management Center" --notes "$NOTES" --latest
          else
            gh release create "$TAG" dist/management.html --target "$GITHUB_SHA" --title "Custom Management Center" --notes "$NOTES" --latest
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq management.html
          echo "Published ${GITHUB_SHA} (${DIGEST})"
