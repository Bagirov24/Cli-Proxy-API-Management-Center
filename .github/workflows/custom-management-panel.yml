name: Build custom Management Center (no APIKEY.FUN)
on:
  push:
    branches:
      - custom-no-apikey-fun
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'index.html'
      - 'logo.jpg'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/custom-management-panel.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build panel
        run: bun run build
      - name: Publish independent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/index.html dist/management.html
          TAG="v8-custom-no-apikey-fun"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/management.html --title "Management Center without APIKEY.FUN" --notes "Custom UI build. Only the APIKEY.FUN navigation is removed; API endpoints, OAuth, and other providers remain unchanged." --latest
