name: SaaS Blueprint Demo Build

on:
  pull_request:
    paths:
      - 'src/features/saasBlueprint/**'
      - 'src/router/MainRoutes.tsx'
      - 'src/App.tsx'
      - 'src/components/layout/MainLayout.tsx'
      - 'vite.config.ts'
      - 'docs/saas/**'
      - 'tests/saasBlueprintDemo.test.ts'
      - '.github/workflows/saas-blueprint-demo-ci.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile explicitly enabled synthetic SaaS UI
        env:
          VITE_ENABLE_SAAS_BLUEPRINT_DEMO: 'true'
        run: |
          bun run build
          test -s dist/index.html
          grep -q 'saas-demo-tenant' dist/index.html

      # Intentionally NO deploy, NO release, NO Railway credentials,
      # NO artifact upload and NO production management panel update.
