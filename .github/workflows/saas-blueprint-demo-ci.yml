name: SaaS Blueprint Demo Build

on:
  pull_request:
    paths:
      - 'src/features/saasBlueprint/**'
      - 'src/router/MainRoutes.tsx'
      - 'src/App.tsx'
      - 'src/components/layout/MainLayout.tsx'
      - 'vite.config.ts'
      - 'docs/saas/**'
      - 'tests/saasBlueprintDemo.test.ts'
      - '.github/workflows/saas-blueprint-demo-ci.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deny accidental SaaS demo enablement in release build
        shell: bash
        env:
          VITE_ENABLE_SAAS_BLUEPRINT_DEMO: 'true'
          SAAS_BLUEPRINT_SYNTHETIC_CI_BUILD: ''
        run: |
          set -euo pipefail
          if bun run build > /tmp/saas-demo-denied-build.log 2>&1; then
            echo "ERROR: ordinary bundle accepted an unsafe SaaS demo opt-in" >&2
            exit 1
          fi
          grep -q 'SAAS BLUEPRINT DEMO DENIED' /tmp/saas-demo-denied-build.log

      - name: Verify default-off bundle excludes synthetic SaaS fixtures
        shell: bash
        run: |
          set -euo pipefail
          unset VITE_ENABLE_SAAS_BLUEPRINT_DEMO SAAS_BLUEPRINT_SYNTHETIC_CI_BUILD
          bun run build
          test -s dist/index.html
          if grep -q 'saas-demo-tenant' dist/index.html; then
            echo "ERROR: synthetic SaaS fixture included in default bundle" >&2
            exit 1
          fi

      - name: Compile explicitly enabled synthetic SaaS UI in PR CI only
        env:
          VITE_ENABLE_SAAS_BLUEPRINT_DEMO: 'true'
          SAAS_BLUEPRINT_SYNTHETIC_CI_BUILD: 'true'
        run: |
          bun run build
          test -s dist/index.html
          grep -q 'saas-demo-tenant' dist/index.html

      # Intentionally NO deploy, NO release, NO Railway credentials,
      # NO artifact upload and NO production management panel update.
