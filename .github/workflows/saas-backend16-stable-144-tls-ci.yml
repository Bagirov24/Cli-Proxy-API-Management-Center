name: Backend16 Official Stable Bun 1.4.4 TLS Candidate (disposable, no release)

on:
  pull_request:
    paths:
      - '.github/workflows/saas-backend16-stable-144-tls-ci.yml'
      - 'scripts/saas-staging/install-backend16-official-stable-144-ci.mjs'
      - 'scripts/saas-staging/verify-backend16-official-stable-144-tls-ci.ts'
      - 'tests/saasBackend16OfficialStable144Ci.test.mjs'
      - 'docs/saas/BACKEND_16_P1_STABLE_144_TLS_CANDIDATE.md'
      - 'scripts/saas-staging/verify-backend16-official-stable-144-physical-pg16-ci.ts'
      - 'scripts/saas-staging/verify-backend16-official-stable-144-mtls-ci.ts'
      - 'tests/saasBackend16Stable144FullPhysicalCi.test.mjs'
      - 'docs/saas/BACKEND_16_P1_STABLE_144_FULL_PHYSICAL_CI.md'
      - 'scripts/saas-staging/backend16-stable-144-combined-contract.mjs'
      - 'scripts/saas-staging/verify-backend16-stable-144-combined-ci.ts'
      - 'scripts/saas-staging/backend16-stable-144-combined-child.ts'
      - 'docs/saas/BACKEND_16_P1_STABLE_144_COMBINED_MTLS_PG16.md'
      - 'scripts/saas-staging/backend16-nodepg-synthetic-mtls-broker-ci.ts'
      - 'scripts/saas-staging/verify-backend16-exact-session-pg16.sh'
      - 'scripts/saas-staging/verify-backend16-bun-physical-pid-ci.ts'
      - 'scripts/saas-staging/verify-backend16-mtls-secret-broker-ci.ts'
      - '.github/workflows/saas-staging-rls-ci.yml'
      - 'src/features/saasBlueprint/controlApi/server/backend16ExactSessionSqlRead.ts'
      - 'src/features/saasBlueprint/controlApi/server/backend16PhysicalPgAdmission.ts'
      - 'src/features/saasBlueprint/controlApi/server/backend16PrivateMtlsVersionedSecretReader.ts'
      - 'src/features/saasBlueprint/controlApi/server/backend16PrivateTenantProjectRead.ts'
      - 'src/features/saasBlueprint/controlApi/server/backend16StagingVersionedPrincipalVault.ts'
      - 'scripts/saas-staging/verify-backend16-native-tls-version-probe-ci.ts'
      - 'scripts/saas-staging/verify-backend16-native-pg-tls-ci.ts'
      - 'src/features/saasBlueprint/controlApi/server/backend16StagingPgTlsTrust.ts'
      - 'src/features/saasBlueprint/controlApi/server/backend16StagingBunPhysicalPgPool.ts'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  official-stable-144-peer:
    name: P1 Bun 1.4.4 actual PG16 peer TLS (NO APPROVAL)
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: saas_ephemeral_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_test_only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_ephemeral_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      CI: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: saas_ephemeral_test
      PGPASSWORD: ci_ephemeral_test_only
      SAAS_B16_STABLE_144_CI: 'true'
      SAAS_B16_STABLE_144_PROBE_CI: 'true'
      B16_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR HEAD, never GitHub synthetic merge
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Node24 for security guard (not app runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refuse altered official stable release pins and weakened TLS negatives
        run: node --test tests/saasBackend16OfficialStable144Ci.test.mjs
      - name: Download OFFICIAL pinned release SHA256 before extracting, then verify exact revision
        run: node scripts/saas-staging/install-backend16-official-stable-144-ci.mjs
      - name: Official stable Bun client through disposable mutual-TLS versioned broker
        env:
          SAAS_B16_EPHEMERAL_CI: 'true'
          SAAS_B16_STABLE_144_FULL_PG16_CI: 'true'
        run: |
          node --test tests/saasBackend16Stable144FullPhysicalCi.test.mjs
          node --experimental-strip-types scripts/saas-staging/verify-backend16-official-stable-144-mtls-ci.ts
      - name: Actual official stable Bun.SQL peer TLS positive and all negatives on disposable PG16
        shell: bash
        env:
          SAAS_B16_CI_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test "${SAAS_B16_STABLE_144_CI}" = "true"
          test "${PGHOST}" = "127.0.0.1"
          test "${PGPORT}" = "5432"
          test "${PGDATABASE}" = "saas_ephemeral_test"
          test ! -e .env.production
          test ! -e /data/auths
          "${SAAS_B16_STABLE_144_BIN:?stable candidate binary required}" scripts/saas-staging/verify-backend16-official-stable-144-tls-ci.ts
