name: SaaS Blueprint Browser QA (synthetic)

on:
  pull_request:
    paths:
      - 'src/features/saasBlueprint/**'
      - 'src/App.tsx'
      - 'src/router/MainRoutes.tsx'
      - 'src/components/layout/MainLayout.tsx'
      - 'tests/browser/saas_demo_browser.py'
      - '.github/workflows/saas-blueprint-browser-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_ENABLE_SAAS_BLUEPRINT_DEMO: 'true'
      SAAS_BROWSER_URL: 'http://127.0.0.1:5173/#/saas-demo-preview'
      SAAS_BROWSER_ARTIFACTS: 'tests/browser/artifacts'

    steps:
      - name: Checkout feature branch (never production)
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked app dependencies
        run: bun install --frozen-lockfile

      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Launch synthetic DEV preview and check responsiveness
        shell: bash
        run: |
          set -euo pipefail
          bun run dev --host 127.0.0.1 --port 5173 --strictPort > /tmp/saas-demo-vite.log 2>&1 &
          echo $! > /tmp/saas-demo-vite.pid
          for i in $(seq 1 45); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:5173/; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:5173/
          python tests/browser/saas_demo_browser.py

      - name: Upload synthetic UI screenshots and acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-blueprint-browser-qa
          path: tests/browser/artifacts/
          if-no-files-found: warn
          retention-days: 7

      # No deploy, release, Railway secrets, Core/Gateway calls or live credentials.
