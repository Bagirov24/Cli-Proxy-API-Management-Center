name: Sandbox Gateway Edge Probe

on:
  push:
    branches:
      - api-gateway-security-review-20261010
    paths:
      - .github/workflows/sandbox-gateway-edge-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for isolated Railway Gateway and probe public Edge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          from urllib import request,error
          base="https://sandbox-gateway-sandbox.up.railway.app"
          for i in range(48):
              try:
                  with request.urlopen(base+"/healthz",timeout=8) as resp:
                      if resp.status==200:
                          print("Sandbox healthz: HTTP 200",flush=True)
                          break
              except Exception:
                  pass
              if i==47:
                  raise RuntimeError("Sandbox gateway did not become healthy within 4 minutes")
              time.sleep(5)
          key="cpa_"+"a"*43
          payload={"model":"gpt-6-luna","messages":[{"role":"user","content":"test"}]}
          def call(spoof,stream=False):
              body={**payload,"stream":stream}
              req=request.Request(base+"/v1/chat/completions",data=json.dumps(body).encode(),headers={
                "Content-Type":"application/json","Authorization":"Bearer "+key,
                "X-Real-IP":spoof,"Accept":"text/event-stream" if stream else "application/json"},method="POST")
              return request.urlopen(req,timeout=15)
          t0=time.monotonic()
          with call("203.0.113.11",True) as resp:
              assert resp.status==200
              assert "text/event-stream" in resp.headers.get("Content-Type","")
              first=second=done=None
              for line in resp:
                  t=time.monotonic()-t0
                  if b'"content":"A"' in line: first=t
                  if b'"content":"B"' in line: second=t
                  if line.startswith(b"data: [DONE]"): done=t;break
          assert None not in (first,second,done),(first,second,done)
          gap=second-first
          print(f"Public Edge SSE: first={first:.3f}s, second={second:.3f}s, gap={gap:.3f}s, DONE={done:.3f}s",flush=True)
          assert gap>=0.75, "SSE was buffered before reaching public client"
          with call("198.51.100.22") as resp:
              assert resp.status==200
              data=json.load(resp)
              seen=data.get("clientIp")
              print("Mock Core received X-Real-IP:",seen,flush=True)
              assert seen not in {"203.0.113.11","198.51.100.22","192.0.2.33",None,"missing"}, "Railway Edge did not replace spoofed client IP"
          try:
              with call("192.0.2.33") as resp:
                  code=resp.status
          except error.HTTPError as e:
              code=e.code
              assert code==429,("IP spoofing bypassed expected per-IP limit",code)
              print("Public Edge 429 enforced despite changed X-Real-IP, retry-after:",e.headers.get("Retry-After"),flush=True)
          else:
              raise AssertionError("IP spoofing bypassed per-client rate limit: HTTP "+str(code))
          print("ALL PUBLIC RAILWAY EDGE PROBES PASSED",flush=True)
          PY
