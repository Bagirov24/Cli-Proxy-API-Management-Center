name: Backend16 Node PG peer verification (disposable, no release)

on:
  pull_request:
    paths:
      - '.github/workflows/saas-backend16-nodepg-peer-ci.yml'
      - 'scripts/saas-staging/verify-backend16-nodepg-peer-ci.ts'
      - 'src/features/saasBlueprint/controlApi/server/backend16StagingPgTlsTrust.ts'
      - 'scripts/saas-staging/verify-backend16-nodepg-real-lock-ci.mjs'
      - 'scripts/saas-staging/verify-backend16-nodepg-installed-tree-ci.mjs'
      - 'tests/saasBackend16NodePgInstalledTreeCi.test.mjs'
      - 'scripts/saas-staging/verify-backend16-nodepg-runtime-lock.mjs'
      - 'scripts/saas-staging/backend16-locked-nodepg-peer-ci.mjs'
      - 'tests/saasBackend16LockedNodePgPeerCi.test.mjs'
      - 'tests/saasBackend16NodePgRealLockCi.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nodepg-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: saas_ephemeral_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_test_only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_ephemeral_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: saas_ephemeral_test
      PGPASSWORD: ci_ephemeral_test_only
      SAAS_B16_NODEPG_PEER_CI: 'true'
      SAAS_B16_LOCKED_NODEPG_PEER_CI: 'true'
      CI: 'true'
    steps:
      - name: Checkout disposable source
        uses: actions/checkout@v4
      - name: Install Node 24 (not a runtime package change)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate independently locked peer TLS contract without install
        run: node --test tests/saasBackend16LockedNodePgPeerCi.test.mjs tests/saasBackend16NodePgInstalledTreeCi.test.mjs
      - name: Verify two independent npm locks and physical PostgreSQL16 peer identities
        shell: bash
        env:
          SAAS_B16_CI_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test "${PGHOST}" = "127.0.0.1"
          test "${PGPORT}" = "5432"
          test "${PGDATABASE}" = "saas_ephemeral_test"
          test ! -e .env.production
          test ! -e /data/auths
          test ! -e package-lock.json
          timeout --signal=TERM --kill-after=5s 330s \
            node scripts/saas-staging/verify-backend16-nodepg-real-lock-ci.mjs
          test ! -e package-lock.json
