name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

  gateway-build-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Go policy security tests
        run: GO111MODULE=off go test -race ./integrations/api-gateway/guard/policy
      - name: Build the isolated custom Caddy image
        run: docker build -f integrations/api-gateway/Dockerfile -t gateway-security-review .
      - name: Validate Caddy modules and configuration
        run: |
          docker run --rm --entrypoint caddy gateway-security-review list-modules | grep -Fx http.handlers.rate_limit
          docker run --rm --entrypoint caddy gateway-security-review list-modules | grep -Fx http.handlers.cpa_key_guard
          docker run --rm --entrypoint caddy gateway-security-review adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate
