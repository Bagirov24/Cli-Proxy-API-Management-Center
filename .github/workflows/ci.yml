name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      # Deliberately separate opt-in fixture. The unmounted project write
      # HTTP adapter may be constructed ONLY on a GitHub CI runner with this
      # explicit flag; no deploy, SQL019 or real tenant secrets.
      - name: Verify M1i synthetic pinned RS256 project HTTP loopback
        env:
          SAAS_EPHEMERAL_M1_HTTP_CI: 'true'
        run: bun test tests/saasM1ProjectHttpBoundary.test.ts
