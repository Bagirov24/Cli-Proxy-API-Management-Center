              RAILWAY_ENVIRONMENT_NAME=production \
              node scripts/saas-staging/archive-witness-railway-staging.mjs \
                > /dev/null 2>&1; then
            echo "ERROR: 7w staging authority accepted a production context" >&2
            exit 1
          fi

      - name: Verify read-only Railway synthetic PKI expiry and signed high-water audit (7x)
        shell: bash
        run: |
          set -euo pipefail
          # No Railway credentials, no external network or database access.
          # Openssl fixture + ephemeral Ed25519 signed high-water in /tmp.
          test "${GITHUB_ACTIONS}" = "true"
          test "${PGHOST}" = "127.0.0.1"
          test "${PGPORT}" = "5432"
          test "${PGUSER}" = "postgres"
          test "${PGDATABASE}" = "saas_ephemeral_test"
          test ! -e .env.production
          test ! -e /data/auths
          command -v openssl >/dev/null
          node --check scripts/saas-staging/audit-railway-highwater-readonly.mjs
          timeout --signal=TERM --kill-after=5s 65s env \
