name: SaaS Staging RLS Contract (ephemeral PostgreSQL)

on:
  pull_request:
    paths:
      - 'staging/saas-rls/**'
      - 'tests/sql/saas_rls_v1.test.sql'
      - 'tests/sql/saas_rls_signed_scope.test.sql'
      - 'tests/sql/saas_scoped_queries.test.sql'
      - 'tests/sql/saas_driver_fixture.test.sql'
      - 'tests/sql/saas_m1_project_metadata.test.sql'
      - 'tests/sql/saas_m1_pg_driver_role.test.sql'
      - 'tests/sql/saas_m1_project_atomic_audit.test.sql'
      - 'tests/sql/saas_m1_physical_disconnect.test.sql'
      - 'tests/sql/saas_m1_unknown_commit_readonly_review.test.sql'
      - 'tests/sql/saas_m1_project_authorization_fence.test.sql'
      - 'tests/sql/saas_e2e_grants_fixture.test.sql'
      - 'tests/sql/saas_authorization_coverage.test.sql'
      - 'tests/sql/saas_authorization_expiry.test.sql'
      - 'tests/sql/saas_actor_session_revision.test.sql'
      - 'tests/sql/saas_publication_outbox.test.sql'
      - 'tests/sql/saas_token_fingerprint_scope.test.sql'
      - 'tests/sql/saas_issuer_session_provisioning.test.sql'
      - 'tests/sql/saas_local_audit_reconciliation.test.sql'
      - 'tests/sql/saas_synthetic_delivery_intent_ack.test.sql'
      - 'tests/sql/saas_synthetic_receiver_ledger.test.sql'
      - 'tests/sql/saas_synthetic_producer_operations.test.sql'
      - 'tests/sql/saas_synthetic_operation_issuance.test.sql'
      - 'tests/sql/saas_synthetic_operation_abuse_limits.test.sql'
      - 'tests/sql/saas_synthetic_retention_legacy_hardstop.test.sql'
      - 'scripts/saas-staging/**'
      - 'src/features/saasBlueprint/controlApi/server/signedSqlBoundary.ts'
      - 'src/features/saasBlueprint/controlApi/server/trustedSqlReadBoundary.ts'
      - 'src/features/saasBlueprint/controlApi/server/syntheticCommittedIntent.ts'
      - 'src/features/saasBlueprint/controlApi/server/authorizationRevision.ts'
      - 'src/features/saasBlueprint/controlApi/server/signedPgAuthorizationRevision.ts'
      - 'src/features/saasBlueprint/controlApi/server/securityAudit.ts'
      - 'tests/saasSecurityAuditContract.test.ts'
      - 'tests/saasTrustedSqlReadBoundary.test.ts'
      - 'docs/saas/**'
      - '.github/workflows/saas-staging-rls-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: saas_ephemeral_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_test_only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_ephemeral_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: saas_ephemeral_test
      PGPASSWORD: ci_ephemeral_test_only
      PGCONNECT_TIMEOUT: '5'

    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL client is installed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Verify legacy tenant RLS and signed transaction-scope hardening
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env.production
          test ! -e /data/auths
          # This accesses only the GitHub Actions ephemeral PostgreSQL service.
          # No Railway integration, CPA keys, OAuth, Core or network egress.
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/saas_rls_v1.test.sql \
            > /tmp/saas-rls-acceptance.log 2>&1 || {
              tail -n 120 /tmp/saas-rls-acceptance.log
              exit 1
            }
          tail -n 15 /tmp/saas-rls-acceptance.log
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/saas_rls_signed_scope.test.sql \
            > /tmp/saas-rls-signed-scope.log 2>&1 || {
              tail -n 120 /tmp/saas-rls-signed-scope.log
              exit 1
            }
          tail -n 15 /tmp/saas-rls-signed-scope.log
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/saas_scoped_queries.test.sql \
            > /tmp/saas-sql-boundary.log 2>&1 || {
              tail -n 120 /tmp/saas-sql-boundary.log
              exit 1
            }
          tail -n 15 /tmp/saas-sql-boundary.log


      - name: Install pinned Bun for ephemeral native PostgreSQL driver
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Seed and exercise non-superuser Bun driver on ephemeral PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          # Fresh random password per CI job, never stored in the repo or logs.
          runner_password="$(openssl rand -hex 24)"
          scope_key="$(psql -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT encode(secret,'hex') FROM saas_rls_private.scope_signers WHERE key_id='ci-pilot'")"
          if [[ ! "$runner_password" =~ ^[0-9a-f]{48}$ ]] ||
             [[ ! "$scope_key" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid ephemeral test-only bootstrap inputs"
            exit 1
          fi
          # psql -v parameter is quoted inside SQL as a literal (not interpolated
          # into identifiers or SQL syntax).
          psql -X -v ON_ERROR_STOP=1 -v ephemeral_password="$runner_password" \
            -f tests/sql/saas_driver_fixture.test.sql \
            > /tmp/saas-driver-fixture.log 2>&1 || {
              tail -n 70 /tmp/saas-driver-fixture.log
              exit 1
            }
          tail -n 6 /tmp/saas-driver-fixture.log
          # CI-only signed tenant/membership/role gate, never Railway.
          # Explicit custom GUC is local to this single psql invocation.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/003_explicit_read_gate_pilot.sql \
            > /tmp/saas-read-gate.log 2>&1 || {
              tail -n 70 /tmp/saas-read-gate.log
              exit 1
            }
          tail -n 5 /tmp/saas-read-gate.log
          timeout --signal=TERM --kill-after=5s 90s env \
            SAAS_EPHEMERAL_DRIVER_CI=true SAAS_EPHEMERAL_SCOPE_KEY_HEX="$scope_key" \
            SAAS_EPHEMERAL_DB_PASSWORD="$runner_password" \
            bun scripts/saas-staging/verify-bun-postgres.mjs
          # All changes below target ONLY the disposable PostgreSQL service.
          # After the independent 2F probes, add grants proving that Pool,
          # Account and Egress visibility do NOT automatically inherit.
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/saas_e2e_grants_fixture.test.sql \
            > /tmp/saas-e2e-grants.log 2>&1 || {
              tail -n 40 /tmp/saas-e2e-grants.log
              exit 1
            }
          tail -n 4 /tmp/saas-e2e-grants.log
          # New 2G.4d.2 private revisions are installed ONLY in ephemeral CI.
          # Existing 2G.4c E2E mutations now exercise writer-side triggers.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/004_tenant_authorization_revisions_pilot.sql \
            > /tmp/saas-authorization-revisions-install.log 2>&1 || {
              tail -n 60 /tmp/saas-authorization-revisions-install.log
              exit 1
            }
          tail -n 3 /tmp/saas-authorization-revisions-install.log
          # M1a STACKED DRAFT PR ONLY: real transactional create/read/rename/
          # soft-disable tenant project metadata in separate disposable schema.
          # No production migration, no HTTP listener, Core/CPA, tokens,
          # keys, JWT issuer, UUID issuance, delivery or GC.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/020_m1_project_metadata_pilot.sql \
            > /tmp/saas-m1a-project-install.log 2>&1 || {
              tail -n 80 /tmp/saas-m1a-project-install.log
              exit 1
            }
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/saas_m1_project_metadata.test.sql \
            > /tmp/saas-m1a-project-acceptance.log 2>&1 || {
              tail -n 100 /tmp/saas-m1a-project-acceptance.log
              exit 1
            }
          tail -n 4 /tmp/saas-m1a-project-acceptance.log
          # M1b STACKED DRAFT: a real Bun.SQL write pilot on this SAME
          # temporary GitHub PostgreSQL16. Grant SET ROLE only AFTER the
          # M1a least-privilege SQL tests have proved default denial.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/saas_m1_pg_driver_role.test.sql \
            > /tmp/saas-m1b-driver-role.log 2>&1 || {
              tail -n 60 /tmp/saas-m1b-driver-role.log
              exit 1
            }
          tail -n 3 /tmp/saas-m1b-driver-role.log
          # M1c (stacked Draft) installs a trigger-owned, private
          # write audit in the SAME disposable PG16 transaction. This
          # migration is NOT permitted in production or as SQL 019.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/021_m1_project_atomic_audit_pilot.sql \
            > /tmp/saas-m1c-audit-install.log 2>&1 || {
              tail -n 80 /tmp/saas-m1c-audit-install.log
              exit 1
            }
          tail -n 3 /tmp/saas-m1c-audit-install.log
          timeout --signal=TERM --kill-after=5s 90s env \
            SAAS_EPHEMERAL_M1_PG_CI=true \
            SAAS_EPHEMERAL_M1E_DISCONNECT_CI=true \
            SAAS_EPHEMERAL_SCOPE_KEY_HEX="$scope_key" \
            SAAS_EPHEMERAL_DB_PASSWORD="$runner_password" \
            bun scripts/saas-staging/verify-m1-project-pg-e2e.mjs
          # M1e: the Bun driver above really killed the reserved PG backend
          # before COMMIT, aborted another signed write, and quarantined both
          # disposable pools; an independent superuser checks project/audit.
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/saas_m1_physical_disconnect.test.sql \
            > /tmp/saas-m1e-physical-disconnect.log 2>&1 || {
              tail -n 85 /tmp/saas-m1e-physical-disconnect.log
              exit 1
            }
          tail -n 5 /tmp/saas-m1e-physical-disconnect.log
          # Inspect ACTUAL native Bun.SQL COMMIT, including the lost ACK
          # project. Audit failure must abort provisional project mutations.
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/saas_m1_project_atomic_audit.test.sql \
            > /tmp/saas-m1c-audit-acceptance.log 2>&1 || {
              tail -n 130 /tmp/saas-m1c-audit-acceptance.log
              exit 1
            }
          tail -n 5 /tmp/saas-m1c-audit-acceptance.log
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/005_metadata_revision_coverage_pilot.sql \
            > /tmp/saas-authorization-coverage-install.log 2>&1 || {
              tail -n 60 /tmp/saas-authorization-coverage-install.log
              exit 1
            }
          tail -n 3 /tmp/saas-authorization-coverage-install.log
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/006_time_aware_revision_pilot.sql \
            > /tmp/saas-expiry-revision-install.log 2>&1 || {
              tail -n 65 /tmp/saas-expiry-revision-install.log
              exit 1
            }
          tail -n 3 /tmp/saas-expiry-revision-install.log
          # The E2E below requires signed FOR SHARE from the guarded 007
          # migration BEFORE its existing cross-process PG acceptance tests.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/007_read_publication_barrier_pilot.sql \
            > /tmp/saas-publication-before-e2e.log 2>&1 || {
              tail -n 65 /tmp/saas-publication-before-e2e.log
              exit 1
            }
          tail -n 3 /tmp/saas-publication-before-e2e.log
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/008_actor_session_epoch_pilot.sql \
            > /tmp/saas-actor-state-install.log 2>&1 || {
              tail -n 65 /tmp/saas-actor-state-install.log
              exit 1
            }
          tail -n 3 /tmp/saas-actor-state-install.log
          # M1d STACKED DRAFT: AFTER 007 signed FOR SHARE and 008 actor
          # epoch install, NOT an alternative auth source or production pool.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/022_m1_project_authorization_fence_pilot.sql \
            > /tmp/saas-m1d-fence-install.log 2>&1 || {
              tail -n 90 /tmp/saas-m1d-fence-install.log
              exit 1
            }
          tail -n 3 /tmp/saas-m1d-fence-install.log
          # Real independent psql connections force both COMMIT orders
          # against the existing tenant epoch lock and mandatory audit.
          timeout --signal=TERM --kill-after=5s 48s env \
            SAAS_EPHEMERAL_M1_FENCE_CI=true \
            bash scripts/saas-staging/verify-m1-project-revoke-fence.sh
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/saas_m1_project_authorization_fence.test.sql \
            > /tmp/saas-m1d-fence-acceptance.log 2>&1 || {
              tail -n 130 /tmp/saas-m1d-fence-acceptance.log
              exit 1
            }
          tail -n 5 /tmp/saas-m1d-fence-acceptance.log
          # Old SQL021 replay would have silently replaced the fenced
          # M1d trigger. It MUST now refuse instead of downgrading it.
          if PGOPTIONS="-c saas.staging_only=true" \
              psql -X -v ON_ERROR_STOP=1 \
                -f staging/saas-rls/021_m1_project_atomic_audit_pilot.sql \
                > /tmp/saas-m1d-downgrade-denial.log 2>&1; then
            echo "ERROR: SQL021 replay downgraded the installed M1d fence"
            exit 1
          fi
          grep -F "M1c atomic audit installation refused outside disposable PG16" \
            /tmp/saas-m1d-downgrade-denial.log >/dev/null || {
              echo "ERROR: SQL021 failed for an unexpected reason"
              exit 1
            }
          psql -X -v ON_ERROR_STOP=1 -c \
            "SELECT saas_rls_test.assert_true(
              EXISTS(SELECT 1 FROM pg_trigger
                WHERE tgrelid='saas_m1_private.projects'::regclass
                  AND tgname='m1_project_atomic_audit'
                  AND tgfoid='saas_m1_private.append_project_write_audit_fenced()'::regprocedure),
              'M1d fence remains active after blocked SQL021 replay')" \
            > /tmp/saas-m1d-after-downgrade.log 2>&1 || {
              tail -n 40 /tmp/saas-m1d-after-downgrade.log
              exit 1
            }
          echo "PASS M1d: SQL021 downgrade is rejected, SQL022 replay retains fence"
          # M1f STACKED DRAFT: closed NOLOGIN operator-only READ ONLY
          # snapshot of M1b/M1c/E local project+audit evidence. This
          # NEVER settles an UNKNOWN COMMIT or authorizes automatic retry.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/023_m1_unknown_commit_readonly_review_pilot.sql \
            > /tmp/saas-m1f-review-install.log 2>&1 || {
              tail -n 100 /tmp/saas-m1f-review-install.log
              exit 1
            }
          tail -n 3 /tmp/saas-m1f-review-install.log
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/saas_m1_unknown_commit_readonly_review.test.sql \
            > /tmp/saas-m1f-review-acceptance.log 2>&1 || {
              tail -n 120 /tmp/saas-m1f-review-acceptance.log
              exit 1
            }
          tail -n 6 /tmp/saas-m1f-review-acceptance.log
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/009_signed_publication_outbox_pilot.sql \
            > /tmp/saas-outbox-install.log 2>&1 || {
              tail -n 75 /tmp/saas-outbox-install.log
              exit 1
            }
          tail -n 3 /tmp/saas-outbox-install.log
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/010_token_fingerprint_scope_pilot.sql \
            > /tmp/saas-token-install.log 2>&1 || {
              tail -n 100 /tmp/saas-token-install.log
              exit 1
            }
          tail -n 4 /tmp/saas-token-install.log
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/011_issuer_subject_enrollment_pilot.sql \
            > /tmp/saas-issuer-install.log 2>&1 || {
              tail -n 100 /tmp/saas-issuer-install.log
              exit 1
            }
          tail -n 4 /tmp/saas-issuer-install.log
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/012_committed_local_audit_reconciliation_pilot.sql \
            > /tmp/saas-audit-reconcile-install.log 2>&1 || {
              tail -n 110 /tmp/saas-audit-reconcile-install.log
              exit 1
            }
          tail -n 3 /tmp/saas-audit-reconcile-install.log
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/013_synthetic_delivery_intent_ack_pilot.sql \
            > /tmp/saas-synthetic-delivery-install.log 2>&1 || {
              tail -n 100 /tmp/saas-synthetic-delivery-install.log
              exit 1
            }
          tail -n 4 /tmp/saas-synthetic-delivery-install.log
          # An independent, local receiver ledger: staging only, no HTTP.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/014_synthetic_receiver_ledger_pilot.sql \
            > /tmp/saas-synthetic-receiver-install.log 2>&1 || {
              tail -n 100 /tmp/saas-synthetic-receiver-install.log
              exit 1
            }
          tail -n 4 /tmp/saas-synthetic-receiver-install.log
          # 015: durable producer key bound to signed 009 and 013 in one txn.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/015_synthetic_producer_operation_pilot.sql \
            > /tmp/saas-producer-id-install.log 2>&1 || {
              tail -n 110 /tmp/saas-producer-id-install.log
              exit 1
            }
          tail -n 4 /tmp/saas-producer-id-install.log
          # 016: signed, time-bounded issued UUIDs and read-only recovery.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/016_synthetic_operation_issuance_pilot.sql \
            > /tmp/saas-operation-issue-install.log 2>&1 || {
              tail -n 120 /tmp/saas-operation-issue-install.log
              exit 1
            }
          tail -n 4 /tmp/saas-operation-issue-install.log
          # 017: rate-limited fixed issuance/status templates, no tombstone GC.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/017_synthetic_operation_abuse_controls_pilot.sql \
            > /tmp/saas-operation-abuse-install.log 2>&1 || {
              tail -n 120 /tmp/saas-operation-abuse-install.log
              exit 1
            }
          tail -n 4 /tmp/saas-operation-abuse-install.log
          # 018: immutable insertion caps and metered legacy SQL facades.
          # No deletion/archiving; this is a one-off disposable PG16 only.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/018_synthetic_retention_legacy_hardstop_pilot.sql \
            > /tmp/saas-retention-legacy-install.log 2>&1 || {
              tail -n 135 /tmp/saas-retention-legacy-install.log
              exit 1
            }
          tail -n 4 /tmp/saas-retention-legacy-install.log
          # Synthetic RS256 keys are generated only in this Bun process.
          # Real wire SQL uses only saas_ci_runner, never the postgres login.
          timeout --signal=TERM --kill-after=5s 90s env \
            SAAS_EPHEMERAL_E2E_CI=true SAAS_EPHEMERAL_SCOPE_KEY_HEX="$scope_key" \
            SAAS_EPHEMERAL_DB_PASSWORD="$runner_password" \
            bun scripts/saas-staging/verify-trusted-pg-e2e.mjs
          unset runner_password scope_key

      - name: Verify staging authorization epochs and concurrent revocation
        shell: bash
        run: |
          set -euo pipefail
          # Apply twice to catch non-idempotent epoch reset on migration replay.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/004_tenant_authorization_revisions_pilot.sql \
            > /tmp/saas-authorization-revisions-replay.log 2>&1 || {
              tail -n 65 /tmp/saas-authorization-revisions-replay.log
              exit 1
            }
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/saas_authorization_revisions.test.sql \
            > /tmp/saas-authorization-revisions-acceptance.log 2>&1 || {
              tail -n 100 /tmp/saas-authorization-revisions-acceptance.log
              exit 1
            }
          tail -n 6 /tmp/saas-authorization-revisions-acceptance.log
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/005_metadata_revision_coverage_pilot.sql \
            > /tmp/saas-authorization-coverage-replay.log 2>&1 || {
              tail -n 50 /tmp/saas-authorization-coverage-replay.log
              exit 1
            }
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/saas_authorization_coverage.test.sql \
            > /tmp/saas-authorization-coverage-acceptance.log 2>&1 || {
              tail -n 90 /tmp/saas-authorization-coverage-acceptance.log
              exit 1
            }
          tail -n 5 /tmp/saas-authorization-coverage-acceptance.log
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/006_time_aware_revision_pilot.sql \
            > /tmp/saas-expiry-revision-replay.log 2>&1 || {
              tail -n 50 /tmp/saas-expiry-revision-replay.log
              exit 1
            }
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/sql/saas_authorization_expiry.test.sql \
            > /tmp/saas-expiry-revision-acceptance.log 2>&1 || {
              tail -n 90 /tmp/saas-expiry-revision-acceptance.log
              exit 1
            }
          tail -n 5 /tmp/saas-expiry-revision-acceptance.log
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/007_read_publication_barrier_pilot.sql \
            > /tmp/saas-publication-migration.log 2>&1 || {
              tail -n 65 /tmp/saas-publication-migration.log
              exit 1
            }
