      - name: Verify offline signed UUID witness with crash and restored-snapshot attacks
        shell: bash
        run: |
          set -euo pipefail
          # 2G.4d.7j: read-only evidence projectors + independent offline
          # Ed25519 signer/verifier. Only one synthetic test INSERT commits;
          # no GC, deletion, export to artifacts, or production access.
          test "${GITHUB_ACTIONS}" = "true"
          test "${PGHOST}" = "127.0.0.1"
          test "${PGDATABASE}" = "saas_ephemeral_test"
          test ! -e .env.production
          test ! -e /data/auths
          timeout --signal=TERM --kill-after=5s 85s env \
            SAAS_EPHEMERAL_ARCHIVE_CI=true \
            node scripts/saas-staging/verify-archive-witness.mjs

      - name: Verify persistent CI-only head against actual PostgreSQL16 backup restore
        shell: bash
        run: |
          set -euo pipefail
          # 2G.4d.7k: ONLY disposable PG16 source and two scratch restore DBs.
          # A full pg_dump stays in job-local 0700 temp storage and is erased.
          # Detached fsynced head is independent of the PostgreSQL dump,
          # but NOT an externally durable cross-run witness.
          test "${GITHUB_ACTIONS}" = "true"
          test "${PGHOST}" = "127.0.0.1"
          test "${PGPORT}" = "5432"
          test "${PGUSER}" = "postgres"
          test "${PGDATABASE}" = "saas_ephemeral_test"
          test ! -e .env.production
          test ! -e /data/auths
          command -v pg_dump
          command -v pg_restore
          command -v createdb
          command -v dropdb
          timeout --signal=TERM --kill-after=5s 160s env \
            SAAS_EPHEMERAL_RESTORE_CI=true \
            node scripts/saas-staging/verify-archive-witness-restoration.mjs

