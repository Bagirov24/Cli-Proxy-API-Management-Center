              RAILWAY_ENVIRONMENT_NAME=production \
              node scripts/saas-staging/audit-railway-highwater-readonly.mjs \
                --railway-sandbox 5c55326f3c90215556c8bdac77ecc9c6d152cdf1e59253492a208f5e18a16411 2 \
                  >/dev/null 2>&1; then
            echo "ERROR: 7x read-only audit accepted production CI context" >&2
            exit 1
          fi

      # No deploy, repository secrets, production SQL connections or credentials.

      # Backend 04 is run AFTER every old SQL001..025 and M1a..M1q job.
      # Migration 026 intentionally changes the mandatory project write
      # trigger so existing actor-only synthetic fixtures cannot be rerun.
      # ALL data/roles are disposable GitHub Actions PostgreSQL16 ONLY.
      - name: Verify durable issuer, membership role and token-bound project session (PostgreSQL16)
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test "${PGHOST}" = "127.0.0.1"
          test "${PGPORT}" = "5432"
          test "${PGDATABASE}" = "saas_ephemeral_test"
          test "${PGUSER}" = "postgres"
          test ! -e .env.production
          test ! -e /data/auths
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/026_durable_project_token_binding_pilot.sql \
            > /tmp/saas-pg26-install.log 2>&1 || {
              tail -n 110 /tmp/saas-pg26-install.log
              exit 1
            }
          tail -n 5 /tmp/saas-pg26-install.log
          # Install after SQL026 and after ALL old CI acceptance, so the
          # new restricted actor projection cannot change prior baselines.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 \
            -f staging/saas-rls/027_current_actor_membership_projection_pilot.sql \
            > /tmp/saas-pg27-install.log 2>&1 || {
              tail -n 110 /tmp/saas-pg27-install.log
              exit 1
            }
          tail -n 5 /tmp/saas-pg27-install.log
          # Distinct ephemeral NON-superuser read login and its own temporary
          # password; no access to scope_signers, private token rows or DML.
          identity_password="$(openssl rand -hex 24)"
          runner_password="$(openssl rand -hex 24)"
          scope_key="$(psql -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT encode(secret,'hex') FROM saas_rls_private.scope_signers WHERE key_id='ci-pilot'")"
          [[ "$identity_password" =~ ^[0-9a-f]{48}$ ]]
          [[ "$runner_password" =~ ^[0-9a-f]{48}$ ]]
          [[ "$scope_key" =~ ^[0-9a-f]{64}$ ]]
          psql -X -v ON_ERROR_STOP=1 \
            -v identity_password="$identity_password" \
            -v runner_password="$runner_password" \
            > /tmp/saas-pg26-ci-roles.log 2>&1 <<'SQL'
          CREATE ROLE saas_identity_ci LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS
            PASSWORD :'identity_password';
          -- PostgreSQL16: only explicit SET ROLE, never inherited privileges.
          GRANT saas_m1_identity_resolver TO saas_identity_ci
            WITH INHERIT FALSE, SET TRUE;
          GRANT CONNECT ON DATABASE saas_ephemeral_test TO saas_identity_ci;
          ALTER ROLE saas_ci_runner PASSWORD :'runner_password';
          SQL
          # Independently verify privileges WITHOUT giving identity role
          # any direct SELECT on private tables or provisioning routines.
          psql -X -v ON_ERROR_STOP=1 -c "
            SELECT saas_rls_test.assert_true(
              NOT has_table_privilege('saas_identity_ci',
                'saas_rls_private.actor_token_sessions','SELECT')
              AND NOT has_table_privilege('saas_identity_ci',
                'saas_m1_private.project_session_token_links','SELECT')
              AND NOT has_function_privilege('saas_identity_ci',
                'saas_m1_api.pin_project_verified_token_session(uuid,text,text,text)',
                'EXECUTE')
              AND pg_has_role('saas_identity_ci',
                'saas_m1_identity_resolver','SET')
              AND NOT pg_has_role('saas_identity_ci',
                'saas_m1_identity_resolver','USAGE')
              AND NOT has_function_privilege('saas_identity_ci',
                'saas_m1_api.resolve_verified_project_session(text,text,text)',
                'EXECUTE')
              AND NOT has_function_privilege('saas_identity_ci',
                'saas_m1_api.resolve_current_actor_memberships(text)',
                'EXECUTE')
              AND has_function_privilege('saas_m1_identity_resolver',
                'saas_m1_api.resolve_current_actor_memberships(text)',
                'EXECUTE')
              AND NOT has_table_privilege('saas_identity_ci',
                'saas_rls.memberships','SELECT')
              AND NOT has_table_privilege('saas_m1_identity_resolver',
                'saas_rls.memberships','SELECT')
              AND NOT has_table_privilege('saas_m1_identity_resolver',
                'saas_rls_private.tenant_authorization_revisions','SELECT'),
              'private read login grant boundaries SQL026 SQL027')" \
            > /tmp/saas-pg26-role-assert.log 2>&1
          timeout --signal=TERM --kill-after=5s 95s env \
            SAAS_DURABLE_IDENTITY_PG_CI=true \
            SAAS_EPHEMERAL_IDENTITY_DB_PASSWORD="$identity_password" \
            SAAS_EPHEMERAL_DB_PASSWORD="$runner_password" \
            SAAS_EPHEMERAL_SCOPE_KEY_HEX="$scope_key" \
            bun scripts/saas-staging/verify-durable-project-identity-pg16.mjs
          # Backend07 CI-only physical PID check after SQL026/027; uses the
          # SAME restricted, short-lived identity role, but its OWN pool.
          # No production credentials, deployment, schema DDL or network.
          node --check scripts/saas-staging/ci-isolated-identity-pool.mjs
          node --check scripts/saas-staging/verify-identity-physical-discard-pg16.mjs
          timeout --signal=TERM --kill-after=5s 75s env \
            SAAS_ISOLATED_IDENTITY_DISCARD_CI=true \
            SAAS_EPHEMERAL_IDENTITY_DB_PASSWORD="$identity_password" \
            bun scripts/saas-staging/verify-identity-physical-discard-pg16.mjs
          unset identity_password runner_password scope_key

      - name: Install Node 24 for isolated Backend16 TLS driver comparison
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pin OFFICIAL stable Bun144 for additional full physical PG16 only
        env:
          SAAS_B16_STABLE_144_CI: 'true'
          B16_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test tests/saasBackend16Stable144FullPhysicalCi.test.mjs
          node scripts/saas-staging/install-backend16-official-stable-144-ci.mjs

      - name: Install integrity-pinned upstream native SQL TLS fix (CI only)
        run: |
          node --test tests/saasBackend16NativeBunCiPin.test.mjs
          node scripts/saas-staging/install-backend16-native-bun-ci.mjs

      - name: Backend08/09 isolated PG16 migrator role, ledger and dump-restore (CI only)
        shell: bash
        env:
          SAAS_B16_CI_PG_CONTAINER: ${{ job.services.postgres.id }}
          B16_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAAS_B16_STABLE_144_FULL_PG16_CI: 'true'
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test "${PGHOST}" = "127.0.0.1"
          test "${PGPORT}" = "5432"
          test "${PGUSER}" = "postgres"
          test "${PGDATABASE}" = "saas_ephemeral_test"
          test ! -e .env.production
          test ! -e /data/auths
          # Offline planner has no SQL write or Railway capabilities.
          node scripts/saas-staging/plan-staging-bootstrap.mjs --plan > /tmp/saas-backend08-plan.json
          node -e '
            const p=require("/tmp/saas-backend08-plan.json");
            if(p.executionAuthorized!==false||p.requiredPostgresMajor!==16||
               p.migration!=="0001_ledger_only"||
               !/^[a-f0-9]{64}$/.test(p.sha256)||
               p.operatorRoleBootstrap?.executionAuthorized!==false||
               !/^[a-f0-9]{64}$/.test(p.operatorRoleBootstrap?.sha256))
              process.exit(1);'
          bootstrap_sha="$(sha256sum staging/saas-bootstrap/0001_ledger_only.sql | cut -d' ' -f1)"
          [[ "$bootstrap_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]]
          # Entirely fresh DB. No pilot SQL001-027 or Railway data enters it.
          createdb -h 127.0.0.1 -p 5432 -U postgres saas_staging_ci
          migrator_password="$(openssl rand -hex 32)"
          [[ "$migrator_password" =~ ^[a-f0-9]{64}$ ]]
          # Backend09 operator DDL only on ephemeral PG16 as postgres.
          PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci -v migration_password="$migrator_password" -f staging/saas-bootstrap/0000_operator_migrator_role.sql > /tmp/saas-backend09-migrator-create.log 2>&1 || {
            tail -n 25 /tmp/saas-backend09-migrator-create.log
            exit 1
          }
          # Backend08 migration is really executed by NON-superuser migrator.
          PGOPTIONS="-c saas.staging_only=true" PGUSER=saas_schema_migrator PGPASSWORD="$migrator_password" psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci -v bootstrap_sha256="$bootstrap_sha" -v source_commit="${GITHUB_SHA}" -f staging/saas-bootstrap/0001_ledger_only.sql > /tmp/saas-backend08-bootstrap.log 2>&1 || {
            tail -n 35 /tmp/saas-backend08-bootstrap.log
            exit 1
          }
          psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci -f tests/sql/saas_staging_bootstrap.test.sql > /tmp/saas-backend08-acceptance.log
          grep -q 'PASS Backend08' /tmp/saas-backend08-acceptance.log
          psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci -f tests/sql/saas_staging_migrator_role.test.sql > /tmp/saas-backend09-privileges.log
          grep -q 'PASS Backend09' /tmp/saas-backend09-privileges.log
          test "$(psql -XAt -d saas_staging_ci -c 'SELECT source_sha256 FROM saas_bootstrap.schema_migrations')" = "$bootstrap_sha"
          # 0000 operator role bootstrap cannot replay and cannot run on pilot.
          if PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci -v migration_password="$migrator_password" -f staging/saas-bootstrap/0000_operator_migrator_role.sql > /tmp/saas-backend09-replay-deny.log 2>&1; then
            echo 'ERROR: Backend09 accepted duplicate operator role bootstrap' >&2
            exit 1
          fi
          if PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 -d saas_ephemeral_test -v migration_password="$migrator_password" -f staging/saas-bootstrap/0000_operator_migrator_role.sql > /tmp/saas-backend09-wrong-db-deny.log 2>&1; then
            echo 'ERROR: Backend09 accepted pilot database' >&2
            exit 1
          fi
          # UNKNOWN COMMIT: never silently retry 0001 ledger.
          if PGOPTIONS="-c saas.staging_only=true" PGUSER=saas_schema_migrator PGPASSWORD="$migrator_password" psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci -v bootstrap_sha256="$bootstrap_sha" -v source_commit="${GITHUB_SHA}" -f staging/saas-bootstrap/0001_ledger_only.sql > /tmp/saas-backend08-replay-deny.log 2>&1; then
            echo 'ERROR: Backend08 accepted unsafe 0001 replay' >&2
            exit 1
          fi
          # Existing pilot database must refuse 0001 too.
          if PGOPTIONS="-c saas.staging_only=true" psql -X -v ON_ERROR_STOP=1 -d saas_ephemeral_test -v bootstrap_sha256="$bootstrap_sha" -v source_commit="${GITHUB_SHA}" -f staging/saas-bootstrap/0001_ledger_only.sql > /tmp/saas-backend08-wrong-db-deny.log 2>&1; then
            echo 'ERROR: Backend08 accepted pilot database' >&2
            exit 1
          fi
          # SQL DML must not change the receipt, including when run as admin.
          if psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci -c "UPDATE saas_bootstrap.schema_migrations SET migration_id='wrong'" > /tmp/saas-backend08-update-deny.log 2>&1; then
            echo 'ERROR: Backend08 ledger UPDATE accepted' >&2
            exit 1
          fi
          # Custom-format dump includes ledger rows; independently restore.
          pg_dump -Fc --no-owner --no-acl -n saas_bootstrap -d saas_staging_ci -f /tmp/saas-backend08-ledger.dump
          createdb -h 127.0.0.1 -p 5432 -U postgres saas_restore_ci
          pg_restore --exit-on-error --no-owner --no-acl -d saas_restore_ci /tmp/saas-backend08-ledger.dump
          restored="$(psql -XAt -d saas_restore_ci -c "SELECT migration_id || ':' || source_sha256 FROM saas_bootstrap.schema_migrations")"
          test "$restored" = "0001_ledger_only:$bootstrap_sha"
          rm -f /tmp/saas-backend08-ledger.dump
          # Backend10 is applied ONLY to disposable saas_staging_ci (not Railway).
          # The user has accepted NO BACKUP in real isolated staging; CI dump
          # verification remains useful but is NOT a live-staging backup claim.
          baseline_sha="$(sha256sum staging/saas-bootstrap/0002_tenant_projects_baseline.sql | cut -d' ' -f1)"
          [[ "$baseline_sha" =~ ^[a-f0-9]{64}$ ]]
          node -e '
            const p=require("/tmp/saas-backend08-plan.json");
            if(p.tenantProjectsBaseline?.executionAuthorized!==false||
               p.tenantProjectsBaseline?.migration!=="0002_tenant_projects_baseline"||
               p.tenantProjectsBaseline?.priorRequiredSha256!==p.sha256||
               p.tenantProjectsBaseline?.sha256!==process.argv[1]) process.exit(1);
          ' "$baseline_sha"
          PGOPTIONS="-c saas.staging_only=true" PGUSER=saas_schema_migrator PGPASSWORD="$migrator_password" \
            psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci \
              -v expected_0001_sha256="$bootstrap_sha" \
              -v migration_sha256="$baseline_sha" \
              -v source_commit="${GITHUB_SHA}" \
              -f staging/saas-bootstrap/0002_tenant_projects_baseline.sql \
              > /tmp/saas-backend10-baseline.log 2>&1 || {
                tail -n 40 /tmp/saas-backend10-baseline.log
                exit 1
              }
          psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci \
            -f tests/sql/saas_staging_tenant_projects_baseline.test.sql \
            > /tmp/saas-backend10-contract.log
          grep -q 'PASS Backend10' /tmp/saas-backend10-contract.log
          test "$(psql -XAt -d saas_staging_ci \
            -c "SELECT source_sha256 FROM saas_bootstrap.schema_migrations WHERE migration_id='0002_tenant_projects_baseline'")" = "$baseline_sha"
          # MUST refuse replay (UNKNOWN COMMIT must be reconciled, not retried).
          if PGOPTIONS="-c saas.staging_only=true" \
              PGUSER=saas_schema_migrator PGPASSWORD="$migrator_password" \
              psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci \
                -v expected_0001_sha256="$bootstrap_sha" \
                -v migration_sha256="$baseline_sha" -v source_commit="${GITHUB_SHA}" \
                -f staging/saas-bootstrap/0002_tenant_projects_baseline.sql \
                > /tmp/saas-backend10-replay-deny.log 2>&1; then
            echo 'ERROR: Backend10 accepted repeat migration' >&2
            exit 1
          fi
          # Exclude even authorized CI migrator from a pilot or wrong database.
          if PGOPTIONS="-c saas.staging_only=true" \
              PGUSER=saas_schema_migrator PGPASSWORD="$migrator_password" \
              psql -X -v ON_ERROR_STOP=1 -d saas_ephemeral_test \
                -v expected_0001_sha256="$bootstrap_sha" \
                -v migration_sha256="$baseline_sha" -v source_commit="${GITHUB_SHA}" \
                -f staging/saas-bootstrap/0002_tenant_projects_baseline.sql \
                > /tmp/saas-backend10-wrong-db-deny.log 2>&1; then
            echo 'ERROR: Backend10 accepted pilot database' >&2
            exit 1
          fi
          # Test live rows on the DISPOSABLE CI database: admin can write,
          # but the table owner still cannot SELECT them due to FORCE RLS.
          psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci \
            -c "WITH t AS (INSERT INTO saas_data.tenants (tenant_key, display_name) VALUES ('ci_tenant', 'CI Tenant') RETURNING tenant_id) INSERT INTO saas_data.projects (tenant_id, project_key, display_name) SELECT tenant_id, 'ci_project', 'CI Project' FROM t"
          for relation in tenants projects; do
            visible="$(PGUSER=saas_schema_migrator PGPASSWORD="$migrator_password" \
              psql -XAt -d saas_staging_ci -c "SELECT COUNT(*) FROM saas_data.$relation")"
            test "$visible" = "0" || {
              echo "ERROR: Backend10 forced RLS leaked $relation" >&2
              exit 1
            }
          done
          if PGUSER=saas_schema_migrator PGPASSWORD="$migrator_password" \
              psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci \
                -c "INSERT INTO saas_data.tenants (tenant_key, display_name) VALUES ('ci_denied', 'Denied')" \
                > /tmp/saas-backend10-owner-insert-deny.log 2>&1; then
            echo 'ERROR: Backend10 migration owner bypassed FORCE RLS' >&2
            exit 1
          fi
          # Remove synthetic data before dumping schema + receipts.
          psql -X -v ON_ERROR_STOP=1 -d saas_staging_ci \
            -c "DELETE FROM saas_data.projects; DELETE FROM saas_data.tenants"
          pg_dump -Fc --no-owner --no-acl \
            -n saas_bootstrap -n saas_data \
            -d saas_staging_ci -f /tmp/saas-backend10-baseline.dump
          createdb -h 127.0.0.1 -p 5432 -U postgres saas_tenant_restore_ci
          pg_restore --exit-on-error --no-owner --no-acl \
            -d saas_tenant_restore_ci /tmp/saas-backend10-baseline.dump
          test "$(psql -XAt -d saas_tenant_restore_ci \
            -c "SELECT COUNT(*) FROM saas_bootstrap.schema_migrations")" = "2"
          test "$(psql -XAt -d saas_tenant_restore_ci \
            -c "SELECT COUNT(*) FROM pg_class WHERE oid IN ('saas_data.tenants'::regclass, 'saas_data.projects'::regclass) AND relrowsecurity AND relforcerowsecurity")" = "2"
          rm -f /tmp/saas-backend10-baseline.dump
          # Backend12: only this disposable PostgreSQL16 receives the two
          # new migrations, synthetic DB logins, tenants and denied-write QA.
          bash -n scripts/saas-staging/verify-backend12-principal-rls-pg16.sh
          SAAS_B12_EPHEMERAL_CI=true \
          SAAS_B12_EPHEMERAL_MIGRATOR_PASSWORD="$migrator_password" \
            bash scripts/saas-staging/verify-backend12-principal-rls-pg16.sh
          # Backend13 runs only AFTER Backend12 synthetic CI identities are
          # removed; new migration is committed as real non-superuser migrator.
          bash -n scripts/saas-staging/verify-backend13-lifecycle-pg16.sh
          SAAS_B13_EPHEMERAL_CI=true \
          SAAS_B13_EPHEMERAL_MIGRATOR_PASSWORD="$migrator_password" \
            bash scripts/saas-staging/verify-backend13-lifecycle-pg16.sh
          # Backend14: session-fenced real authenticated LOGIN acceptance
          # is disposable PG16 ONLY, after the Backend13 synthetic fixtures.
          bash -n scripts/saas-staging/verify-backend14-session-pg16.sh
          SAAS_B14_EPHEMERAL_CI=true \
          SAAS_B14_EPHEMERAL_MIGRATOR_PASSWORD="$migrator_password" \
            bash scripts/saas-staging/verify-backend14-session-pg16.sh
          # Backend15: new operator fingerprint gate; real PG16 auth and
          # concurrent revoke tests are only in disposable GitHub Actions.
          bash -n scripts/saas-staging/verify-backend15-subject-binding-pg16.sh
          SAAS_B15_EPHEMERAL_CI=true \
          SAAS_B15_EPHEMERAL_MIGRATOR_PASSWORD="$migrator_password" \
            bash scripts/saas-staging/verify-backend15-subject-binding-pg16.sh
          # Backend16.4: isolated real PG16 exact subject/session/binding and
          # physical per-LOGIN revocation race, after Backend15 fixture cleanup.
          bash -n scripts/saas-staging/verify-backend16-exact-session-pg16.sh
          SAAS_B16_EPHEMERAL_CI=true \
          SAAS_B16_EPHEMERAL_MIGRATOR_PASSWORD="$migrator_password" \
            bash scripts/saas-staging/verify-backend16-exact-session-pg16.sh
          echo 'PASS Backend10: PG16 tenant/project deny-all RLS, no runtime grants, denied replay/pilot, isolated restore'
          unset migrator_password
          echo 'PASS Backend08: signed migration receipt, no replay, separate CI dump-restore'
          echo 'PASS Backend09: non-superuser migrator/no inherited privilege, no pilot DB'

