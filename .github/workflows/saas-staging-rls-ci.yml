          node --check scripts/saas-staging/archive-witness-railway-staging.mjs
          if env SAAS_REMOTE_STAGING_ONLY=true \
              SAAS_HIGHWATER_TRANSPORT_SCOPE=SYNTHETIC_NO_ISSUER \
