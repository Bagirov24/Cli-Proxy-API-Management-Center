name: Verify CPA Key Policy integration
on:
  push:
    branches:
      - custom-no-apikey-fun
    paths:
      - 'integrations/cpa-key-policy/**'
      - '.github/workflows/verify-cpa-key-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned plugin image
        run: docker build --pull --platform linux/amd64 -f integrations/cpa-key-policy/Dockerfile -t cliproxyapi-key-policy:verify .
      - name: Check bundled plugin and Core executable
        run: |
          docker run --rm --platform linux/amd64 --entrypoint /bin/sh cliproxyapi-key-policy:verify -ec '
            test -x /CLIProxyAPI/CLIProxyAPI
            test -s /CLIProxyAPI/plugins/linux/amd64/cpa-key-policy.so
            ldd /CLIProxyAPI/plugins/linux/amd64/cpa-key-policy.so
          '
